name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  e2e:
    name: E2E Tests
    timeout-minutes: 60
    # Pinned: ubuntu-latest is 26.04 now and Playwright 1.59 cannot install Chromium there.
    runs-on: ubuntu-24.04

    # The local stack: playwright.config.ts starts apps/api on a fresh database of this
    # server (migrated on start) and the web dev server, which proxies /api to it.
    services:
      postgres:
        image: postgres:18.7-alpine
        env:
          POSTGRES_USER: dalva
          POSTGRES_PASSWORD: dalva
          POSTGRES_DB: dalva
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dalva -d dalva"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium
        working-directory: apps/web

      - name: Run Playwright tests
        run: bunx playwright test --project=chromium
        working-directory: apps/web
        env:
          E2E_DATABASE_URL: postgres://dalva:dalva@127.0.0.1:5432/dalva_e2e

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 30
