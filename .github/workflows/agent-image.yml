name: Agent image

on:
  push:
    branches: [main]
    paths:
      - apps/agent/**
      - packages/finance-contract/**
      # Files the Dockerfile copies or the build context excludes.
      - package.json
      - bun.lock
      - tsconfig.json
      - .dockerignore
      - apps/*/package.json
      - packages/*/package.json
      - .github/workflows/agent-image.yml
  pull_request:
    branches: [main]
    paths:
      - apps/agent/**
      - packages/finance-contract/**
      # Files the Dockerfile copies or the build context excludes.
      - package.json
      - bun.lock
      - tsconfig.json
      - .dockerignore
      - apps/*/package.json
      - packages/*/package.json
      - .github/workflows/agent-image.yml
  workflow_dispatch:

concurrency:
  group: agent-image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/dalva-agent

jobs:
  image:
    name: Build${{ github.event_name != 'pull_request' && ' and push' || '' }}
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # Only used on push/dispatch; PR runs never log in.
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags
        id: tags
        run: |
          image="$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')"
          {
            echo "tags<<EOF"
            echo "${image}:${GITHUB_SHA::7}"
            # A manual run from another branch never moves latest.
            if [ "$GITHUB_REF" = "refs/heads/main" ]; then echo "${image}:latest"; fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build${{ github.event_name != 'pull_request' && ' and push' || '' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/agent/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          # No attestation manifests: they show up as untagged versions in GHCR.
          provenance: false
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
