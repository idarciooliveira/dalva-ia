name: Images

# Builds ghcr.io/<owner>/dalva-{api,web,agent}. Each image builds only when its own inputs
# change (or on a manual run). Pull requests build without pushing. Pushes to main publish
# :<short-sha> and :latest; a manual run from another branch publishes only :<short-sha>.

on:
  push:
    branches: [main]
    paths: &paths
      - apps/agent/**
      - apps/api/**
      - apps/web/**
      - packages/**
      # Files the Dockerfiles copy or the build contexts exclude.
      - package.json
      - bun.lock
      - tsconfig.json
      - .dockerignore
      - .github/workflows/images.yml
  pull_request:
    branches: [main]
    paths: *paths
  workflow_dispatch:

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    name: Changed images
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      images: ${{ github.event_name == 'workflow_dispatch' && '["agent","api","web"]' || steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        if: github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@v3
        with:
          # Same inputs as the old agent-image.yml for the agent.
          filters: |
            agent:
              - apps/agent/**
              - packages/finance-contract/**
              - package.json
              - bun.lock
              - tsconfig.json
              - .dockerignore
              - apps/*/package.json
              - packages/*/package.json
              - .github/workflows/images.yml
            api:
              - apps/api/**
              - packages/finance-contract/**
              - package.json
              - bun.lock
              - tsconfig.json
              - apps/*/package.json
              - packages/*/package.json
              - .github/workflows/images.yml
            web:
              - apps/web/**
              - packages/**
              - package.json
              - bun.lock
              - tsconfig.json
              - apps/*/package.json
              - .github/workflows/images.yml

  image:
    name: ${{ matrix.image }}${{ github.event_name != 'pull_request' && ' (push)' || '' }}
    needs: changes
    if: needs.changes.outputs.images != '[]' && needs.changes.outputs.images != ''
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # Only used on push/dispatch; PR runs never log in.
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.changes.outputs.images) }}

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags
        id: tags
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/dalva-${{ matrix.image }}
        run: |
          image="$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')"
          {
            echo "tags<<EOF"
            echo "${image}:${GITHUB_SHA::7}"
            # A manual run from another branch never moves latest.
            if [ "$GITHUB_REF" = "refs/heads/main" ]; then echo "${image}:latest"; fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build${{ github.event_name != 'pull_request' && ' and push' || '' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.image }}/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          # Build-time for the SPA: the Settings -> Telegram deep link. Repo variable, optional.
          build-args: ${{ matrix.image == 'web' && format('VITE_TELEGRAM_BOT_USERNAME={0}', vars.TELEGRAM_BOT_USERNAME) || '' }}
          # No attestation manifests: they show up as untagged versions in GHCR.
          provenance: false
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=dalva-${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=dalva-${{ matrix.image }}
