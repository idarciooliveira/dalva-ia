name: Compose stack

on:
  pull_request:
    branches: [main]
    paths:
      - compose.yml
      - deploy/**
      - apps/*/Dockerfile
      - apps/*/Dockerfile.dockerignore
      - apps/web/Caddyfile
      - apps/api/drizzle/**
      - apps/api/src/**
      - apps/agent/src/**
      - apps/web/**
      - packages/**
      - apps/*/package.json
      - package.json
      - bun.lock
      - tsconfig.json
      - .dockerignore
      - .github/workflows/images.yml
      - .github/workflows/stack.yml
  workflow_dispatch:

concurrency:
  group: stack-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  stack:
    name: Stack smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      COMPOSE_PROJECT_NAME: dalva-ci
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          load: true
          provenance: false
          tags: ghcr.io/ci/dalva-api:latest
          cache-from: type=gha,scope=dalva-api
      - name: Build web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          load: true
          provenance: false
          tags: ghcr.io/ci/dalva-web:latest
          cache-from: type=gha,scope=dalva-web
      - name: Build agent
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/agent/Dockerfile
          load: true
          provenance: false
          tags: ghcr.io/ci/dalva-agent:latest
          cache-from: type=gha,scope=dalva-agent

      - name: Write .env
        run: |
          secret() { openssl rand -hex 32; }
          {
            echo "GHCR_OWNER=ci"
            echo "POSTGRES_PASSWORD=$(secret)"
            echo "PUBLIC_URL=https://dalva-ci.example.com"
            echo "BETTER_AUTH_SECRET=$(secret)"
            echo "FINANCE_API_SERVICE_KEY=$(secret)"
          } > .env
          [ "$(grep -c . .env)" = 5 ]

      - name: Validate compose file
        run: docker compose config --quiet

      - name: Start the stack
        run: |
          docker network create dokploy-network
          docker compose pull postgres backup
          docker compose up -d --pull never postgres migrate api web agent backup

      - name: Smoke test
        run: deploy/smoke.sh
        env:
          SMOKE_FIRST_USER: "1"

      - name: Logs
        if: always()
        run: |
          docker compose ps -a
          docker compose logs --no-color --timestamps

      - name: Stop
        if: always()
        run: |
          docker compose down -v
          docker network rm dokploy-network || true
