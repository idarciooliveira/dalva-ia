name: dalva-dev

services:
  postgres:
    image: postgres:18.7-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: dalva
      POSTGRES_PASSWORD: dalva
      POSTGRES_DB: dalva
    ports:
      - "127.0.0.1:${DALVA_POSTGRES_PORT:-5432}:5432"
    volumes:
      # Postgres 18 images keep data under /var/lib/postgresql/<major>/docker.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dalva -d dalva"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres-data:
