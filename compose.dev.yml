# Local development Postgres for apps/api. Not used in production.
#   docker compose -f compose.dev.yml up -d
# The API reads DATABASE_URL (apps/api/.env.example has the URL for this server);
# the apps/api test suite uses TEST_DATABASE_URL, which defaults to this server.
name: dalva-dev

services:
  postgres:
    image: postgres:18.7-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: dalva
      POSTGRES_PASSWORD: dalva
      POSTGRES_DB: dalva
    ports:
      # Loopback only. Set DALVA_POSTGRES_PORT if 5432 is taken.
      - "127.0.0.1:${DALVA_POSTGRES_PORT:-5432}:5432"
    volumes:
      # Postgres 18 images keep data under /var/lib/postgresql/<major>/docker.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dalva -d dalva"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres-data:
